<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>loggers — target-routed JSON Lines logging for Rust</title>
<desc>Log records are routed by target to per-target JSON Lines files, and records that no logger claims are offered to a catch-all fallback.</desc>
<style>
  .ts    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 13px; fill: #444441; }
  .tl    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #534AB7; letter-spacing: 2px; }
  .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 30px; font-weight: 600; fill: #2C2C2A; }
  .glab  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.5px; }
  .chip  { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; fill: #444441; }
  .node  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #2C2C2A; }
  .gray-fill   { fill: #F1EFE8; stroke: #C7C5BD; stroke-width: 0.6; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.6; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
  .arrd { stroke: #534AB7; stroke-width: 1.6; fill: none; }
  @media (prefers-color-scheme: dark) {
    .ts    { fill: #C7C5BD; }
    .tl    { fill: #AFA9EC; }
    .title { fill: #E5E5E2; }
    .glab  { fill: #8C8B85; }
    .chip  { fill: #C7C5BD; }
    .node  { fill: #E5E5E2; }
    .gray-fill   { fill: #3A3A37; stroke: #5F5E5A; }
    .purple-fill { fill: #534AB7; stroke: #AFA9EC; }
    .teal-fill   { fill: #0F6E56; stroke: #5DCAA5; }
    .arrd { stroke: #AFA9EC; }
  }
</style>
<defs>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="tl"    x="44" y="96">RUST · LOG BACKEND</text>
<text class="title" x="42" y="140">loggers</text>
<text class="ts"    x="44" y="176">Routes each record to a log file by its target,</text>
<text class="ts"    x="44" y="196">as JSON Lines, with a catch-all fallback.</text>

<!-- incoming records, labelled by target -->
<rect class="gray-fill" x="454" y="90"  width="70" height="26" rx="5"/>
<rect class="gray-fill" x="454" y="128" width="70" height="26" rx="5"/>
<rect class="gray-fill" x="454" y="166" width="70" height="26" rx="5"/>
<text class="chip" x="466" y="107">"app"</text>
<text class="chip" x="466" y="145">"db"</text>
<text class="chip" x="466" y="183">"other"</text>
<text class="glab" x="454" y="216">records</text>

<!-- fan-in to the dispatcher -->
<path d="M530 103 Q548 103 552 141" class="arrd" marker-end="url(#arrowAccent)"/>
<path d="M530 141 H552" class="arrd" marker-end="url(#arrowAccent)"/>
<path d="M530 179 Q548 179 552 141" class="arrd" marker-end="url(#arrowAccent)"/>

<rect class="purple-fill" x="566" y="114" width="68" height="54" rx="8"/>
<text class="node" x="580" y="146">Logger</text>
<text class="glab" x="566" y="216">route by target</text>

<!-- fan-out to per-target files, plus the fallback -->
<path d="M640 141 Q660 141 664 103" class="arrd" marker-end="url(#arrowAccent)"/>
<path d="M640 141 H664" class="arrd" marker-end="url(#arrowAccent)"/>
<path d="M640 141 Q660 141 664 179" class="arrd" marker-end="url(#arrowAccent)"/>

<rect class="teal-fill"   x="672" y="90"  width="136" height="26" rx="5"/>
<rect class="teal-fill"   x="672" y="128" width="136" height="26" rx="5"/>
<rect class="purple-fill" x="672" y="166" width="136" height="26" rx="5"/>
<text class="chip" x="684" y="107">app.log</text>
<text class="chip" x="684" y="145">db.log</text>
<text class="chip" x="684" y="183">fallback.log</text>
<text class="glab" x="672" y="216">JSON Lines</text>
</svg>
